<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travessia das Capivaras</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="game">
      <header id="game-header" hidden>Travessia das Capivaras</header>
      <div id="title-view" hidden></div>
      <section id="play" hidden></section>
      <div id="utility"></div>
      <p role="status" id="notice"></p>
      <section class="save" aria-labelledby="save-heading">
        <div>
          <h2 id="save-heading">Seu progresso</h2>
          <p id="count"></p>
          <progress max="48" id="meter" aria-label="Travessias concluídas"></progress>
          <p>Fotografe esta tela para continuar em outro aparelho.</p>
          <div class="save-code">
            <strong id="code"></strong>
            <button type="button" id="copy">Copiar código</button>
          </div>
        </div>
        <canvas id="qr" role="img" aria-label="QR para continuar o jogo"></canvas>
      </section>
      <footer>
        <button type="button" id="restore">Continuar com um código</button>
        <button type="button" id="reset">Começar de novo</button>
      </footer>
    </main>
    <dialog id="restore-dialog" aria-labelledby="question">
      <form method="dialog">
        <h2 id="question"></h2>
        <input id="entry" aria-label="Código de progresso" maxlength="64" autocomplete="off">
        <p id="error" role="alert"></p>
        <div class="restore-actions">
          <button value="cancel">Cancelar</button>
          <button type="button" id="confirm" class="primary">Confirmar</button>
        </div>
      </form>
    </dialog>
    <dialog id="album-dialog"></dialog>
    <script type="module" src="./main.js"></script>
  </body>
</html>
